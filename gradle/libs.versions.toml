[versions]
agp = "9.1.0"
kotlin = "2.2.10"
ksp = "2.3.6"
compose-bom = "2025.08.01"
hilt = "2.59.2"
room = "2.8.4"
navigation = "2.8.5"
lifecycle = "2.8.7"
coroutines = "1.9.0"
datastore = "1.1.1"
work = "2.10.0"
camerax = "1.4.0"
zxingcpp = "3.1.1"
documentfile = "1.0.1"
robolectric = "4.16.1"
androidx-test-core = "1.6.1"
truth = "1.4.4"
coroutines-test = "1.9.0"

[libraries]
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# material3 is BOM-managed now too (1.3.2 via BOM 2025.08.01) — it used to be pinned at 1.3.1,
# an explicit override that predated the 2025.08.01 BOM bump. Dropping the pin keeps the whole
# compose stack under the BOM, exactly like foundation/ui/animation.
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
# BOM 2025.08.01 pins the whole compose stack at 1.9.0 (foundation, foundation-layout, ui,
# animation, runtime) — the version the app runtime actually ships. Previously the BOM (2024.12.01)
# pinned 1.7.6 while androidx.emoji2's transitive constraint forced foundation 1.9.0 at runtime;
# foundation's FlowRow signature changed between 1.7.6 and 1.9.0 (gained a verticalAlignment
# parameter), so modules compiled against 1.7.6 crashed with NoSuchMethodError on FlowRow (habits
# Caffeine tap). With the aligned BOM, every module compiles against the same 1.9.0 stack. Explicit
# foundation deps below are declared for dependency hygiene (DailyLogScreen uses FlowRow), not
# version overrides.
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }

# Activity & Core
activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }

# Lifecycle
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Health Connect
health-connect = { group = "androidx.health.connect", name = "connect-client", version = "1.1.0-alpha10" }

# CameraX
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# QR scanning — zxing-cpp (Apache-2.0). Deliberately not com.google.mlkit:barcode-scanning:
# ML Kit drags in play-services-basement and com.google.android.datatransport (Google's Cloud
# Client Telemetry transport), which injects android.permission.INTERNET into the merged manifest
# and is disqualifying under F-Droid's inclusion policy. zxing-cpp is a pure NDK decoder with no
# Google Play Services dependency and no network access.
zxingcpp = { group = "io.github.zxing-cpp", name = "android", version.ref = "zxingcpp" }

# DocumentFile
documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# Testing
junit = { group = "junit", name = "junit", version = "4.13.2" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
# Real org.json reference implementation for plain-JVM unit tests — the Android SDK's org.json
# stub classes throw "not mocked" at unit-test runtime without Robolectric; this shadows them
# with the actual implementation on the test classpath instead of pulling in Robolectric.
org-json = { group = "org.json", name = "json", version = "20240303" }

# FFT / Signal Processing
jtransforms = { group = "com.github.wendykierp", name = "JTransforms", version = "3.1" }

# LiteRT — the TFLite runtime's current name (Task 14 — AUDIO-01 YAMNet audio classification).
# org.tensorflow:tensorflow-lite is stuck at 2.16.1 on Maven Central and ships a
# libtensorflowlite_jni.so with 4KB (0x1000) ELF segment alignment, which Android 15+ flags as
# incompatible with 16KB-page devices. LiteRT is the same runtime, still exposing
# org.tensorflow.lite.Interpreter, built with 16KB (0x4000) alignment.
# Pinned to 2.1.5: 2.1.6 splits out a litert-api artifact that declares the same
# com.google.ai.edge.litert namespace as litert itself, which AGP's manifest merger rejects.
tensorflow-lite = { group = "com.google.ai.edge.litert", name = "litert", version = "2.1.5" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
