name: Release

# Cut a signed Android release: build the release APK, sign it with the keystore
# supplied via repo secrets, and attach it to a GitHub Release.
#
# Secrets required (set in Settings -> Secrets and variables -> Actions):
#   SIGNING_KEY          - base64 of the release keystore (see README of this workflow / repo notes)
#   KEY_ALIAS            - alias used at keytool -genkey time
#   KEYSTORE_PASSWORD    - keystore password
#   KEY_PASSWORD         - private-key password
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release needs this to create the release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle.properties pins org.gradle.java.home to a local path that does not exist on a
      # runner, so every Gradle invocation overrides it with the JDK setup-java just installed.
      # assembleRelease without keystore.properties (which is gitignored and absent here) still
      # produces an unsigned APK — the sign step below does the actual signing.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # Sign with apksigner directly instead of a third-party action (the widely used
      # r0adkll/sign-android-release@v1 is effectively unmaintained: the v1 tag dates to 2021,
      # still runs on deprecated node12, and has an open F-Droid-reproducibility bug for
      # build-tools >= 35, issue #99). apksigner is the same tool AGP itself uses, and with
      # v1 signing disabled (minSdk 26 >= 24) there are no JAR-signing timestamps in the output.
      # Note: signed bytes are not guaranteed stable across runner image updates, since the
      # newest installed apksigner is selected — irrelevant for F-Droid, which strips and
      # re-signs; the unsigned APK (deterministic) is what their rebuild check compares.
      #
      # Secrets: SIGNING_KEY (base64 of the keystore), KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD.
      # Passwords are passed to apksigner via env: so they never appear in the process argv.
      - name: Sign release APK
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Runner images preinstall several build-tools; use the newest installed apksigner.
          APKSIGNER="$(ls -1 "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Using apksigner: $APKSIGNER"
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd app/build/outputs/apk/release
          # No keystore.properties on CI, so AGP names the output app-release-unsigned.apk.
          UNSIGNED="$(ls app-release-unsigned.apk 2>/dev/null || ls app-release.apk)"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --v1-signing-enabled false \
            --out app-release-signed.apk \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs app-release-signed.apk
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-signed.apk
