name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins org.gradle.java.home to a local Arch path so the maintainer's
      # machine picks the right JDK. That path does not exist on a runner, so every Gradle
      # invocation here overrides it with the JDK actions/setup-java just installed.
      - name: Assemble debug APK (standalone channel)
        run: ./gradlew assembleStandaloneDebug -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # Runs BOTH the flavored-module suite (testStandaloneDebugUnitTest) and the non-flavored
      # modules' suite (testDebugUnitTest). core:domain/core:ui/core:health are deliberately kept
      # on compileSdk 35 without the channel dimension, so their unit tests only exist under
      # testDebugUnitTest — running just testStandaloneDebugUnitTest would silently skip the whole
      # domain layer and over-report coverage.
      - name: Run unit tests
        run: ./gradlew testStandaloneDebugUnitTest testDebugUnitTest -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # A transitive constraint (androidx.emoji2 -> foundation 1.9.0) once forced the app runtime
      # to a newer compose foundation than modules compiled against; FlowRow's changed signature
      # made the habits forms crash with NoSuchMethodError on-device. This task fails if any
      # module's compile classpath resolves a different androidx.compose.foundation version than
      # :app ships, so the class of bug is caught in CI instead of by a user.
      - name: Compose foundation versions align (compile == shipped)
        run: ./gradlew verifyComposeFoundationAlignment -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # README.md (and CONTRIBUTING.md) advertise a unit-test count that drifts the moment
      # anyone adds or removes a test, and nothing complains until a user notices the number is
      # wrong — the same doc-accuracy problem the emoji guardrail solves. Sum the tests="..."
      # attributes from the results this job just produced (a fresh checkout, so no stale XMLs)
      # and fail if either doc's number no longer matches the suite — or if the count was removed
      # from a doc altogether.
      #
      # The suite spans two task result trees because the module set is split by the channel
      # flavor dimension: flavored modules report under testStandaloneDebugUnitTest, while the
      # non-flavored core modules (domain/ui/health) report under testDebugUnitTest. To avoid
      # double-counting a flavored module's src/test (present in BOTH trees), each module's
      # testDebugUnitTest results are only counted when that module produces no standalone tree.
      - name: README test count matches the suite
        run: |
          set -euo pipefail
          # || true keeps the assignment from aborting under -o pipefail when no XMLs exist.
          STANDALONE=$(find . -path '*/build/test-results/testStandaloneDebugUnitTest/TEST-*.xml' -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*"' 2>/dev/null \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}') || true
          STANDALONE=${STANDALONE:-0}
          NONFLAVORED=0
          while IFS= read -r dir; do
            module=${dir#./}
            module=${module%/build/test-results/testDebugUnitTest}
            # Skip flavored modules — their src/test tests are already in STANDALONE. A module
            # is "flavored" only if its standalone tree produced real result files. Gradle makes
            # the testStandaloneDebugUnitTest directory for EVERY module (even no-channel ones,
            # as a NO-SOURCE task), so an empty dir must not count as flavored.
            sa_xmls=$(find "$module/build/test-results/testStandaloneDebugUnitTest" \
              -name 'TEST-*.xml' 2>/dev/null | wc -l)
            [ "$sa_xmls" -gt 0 ] && continue
            for f in "$dir"/TEST-*.xml; do
              [ -f "$f" ] || continue
              t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              NONFLAVORED=$((NONFLAVORED + t))
            done
          done < <(find . -type d -path '*/build/test-results/testDebugUnitTest')
          TOTAL=$((STANDALONE + NONFLAVORED))
          # Anchored to the claim lines so prose that repeats "N unit tests" can't double-match;
          # tail -1 keeps the last (real) claim if the docs are ever edited to repeat it.
          README_CLAIMED=$(grep -oE '# [0-9]+ unit tests' README.md | grep -oE '[0-9]+' | tail -1 || true)
          CONTRIBUTING_CLAIMED=$(grep -oE 'currently runs [0-9]+ unit tests' CONTRIBUTING.md \
            | grep -oE '[0-9]+' | tail -1 || true)
          FAIL=0
          if [ -z "$README_CLAIMED" ] || [ "$README_CLAIMED" != "$TOTAL" ]; then
            echo "::error::README.md claims \"${README_CLAIMED:-no count} unit tests\" but the suite has $TOTAL — update the count."
            FAIL=1
          fi
          if [ -z "$CONTRIBUTING_CLAIMED" ] || [ "$CONTRIBUTING_CLAIMED" != "$TOTAL" ]; then
            echo "::error::CONTRIBUTING.md claims \"${CONTRIBUTING_CLAIMED:-no count} unit tests\" but the suite has $TOTAL — update the count."
            FAIL=1
          fi
          [ "$FAIL" -eq 0 ] && echo "OK: README ($README_CLAIMED) and CONTRIBUTING ($CONTRIBUTING_CLAIMED) match the suite ($TOTAL)."
          exit "$FAIL"

      - name: Android Lint
        run: ./gradlew lintStandaloneDebug -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  privacy-guardrails:
    name: Privacy guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # These are the claims PRIVACY.md and the README make to users. They are cheap to assert
      # and expensive to notice breaking, because a transitive dependency can reintroduce any of
      # them without a single line of our own code changing.
      - name: No Google Play Services on the release classpath
        run: |
          ./gradlew :app:dependencies --configuration standaloneReleaseRuntimeClasspath \
            -Dorg.gradle.java.home="$JAVA_HOME" -q > deps.txt
          if grep -qE 'play-services|com\.google\.android\.play|com\.google\.mlkit' deps.txt; then
            echo "::error::Google Play Services artifacts are back on the release classpath:"
            grep -E 'play-services|com\.google\.android\.play|com\.google\.mlkit' deps.txt
            exit 1
          fi
          echo "OK: no GMS artifacts."

      - name: Auto Backup stays disabled and INTERNET stays scoped to core:data
        run: |
          # --rerun-tasks because the merger report is only rewritten when the task actually
          # runs. An UP-TO-DATE or cache-restored manifest task leaves a stale report on disk,
          # and a stale report would let this check pass against yesterday's dependency graph.
          ./gradlew :app:processStandaloneReleaseMainManifest --rerun-tasks \
            -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace
          MANIFEST=app/build/intermediates/merged_manifest/standaloneRelease/processStandaloneReleaseMainManifest/AndroidManifest.xml
          REPORT=app/build/outputs/logs/manifest-merger-standalone-release-report.txt

          grep -q 'android.permission.INTERNET' core/data/src/main/AndroidManifest.xml \
            || { echo "::error::core/data no longer declares INTERNET — NAS sync would fail"; exit 1; }

          grep -q 'android:allowBackup="false"' "$MANIFEST" \
            || { echo "::error::allowBackup is not false in the merged manifest"; exit 1; }
          grep -q 'android:dataExtractionRules=' "$MANIFEST" \
            || { echo "::error::dataExtractionRules is missing (API 31+ backup opt-out)"; exit 1; }
          grep -q 'android:fullBackupContent=' "$MANIFEST" \
            || { echo "::error::fullBackupContent is missing (API 26-30 backup opt-out)"; exit 1; }

          # INTERNET is allowed, but only when it comes from the module that owns NAS sync.
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            grep -A1 'uses-permission#android.permission.INTERNET' "$REPORT" | grep -q '\[:core:data\]' \
              || { echo "::error::INTERNET is being contributed by something other than :core:data"; \
                   grep -A1 'uses-permission#android.permission.INTERNET' "$REPORT"; exit 1; }
          fi
          echo "OK: backup opt-out intact, INTERNET scoped to :core:data."

  style-guardrails:
    name: Style guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # CONTRIBUTING.md's "no emoji in source or user-facing text" is a promise to users exactly
      # like the privacy claims above: cheap to assert, expensive to notice breaking, because a
      # doc rewrite or a copy-paste can reintroduce emoji in a heading or a string with no
      # compiler complaining. Scans every tracked file; grep -I skips binaries (yamnet.tflite,
      # gradle-wrapper.jar) so they can't trip it. Covers the emoji pictograph ranges, the
      # Miscellaneous Symbols block (e.g. the U+26A0 warning sign removed in Aug 2026), the
      # emoji variation selector, and the ZWJ used in emoji sequences.
      - name: No emoji in tracked source or docs
        run: |
          EMOJI_HITS=$(git ls-files -z | xargs -0 grep -nPI \
            '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{FE0F}\x{200D}]' 2>/dev/null || true)
          if [ -n "$EMOJI_HITS" ]; then
            echo "::error::Emoji characters found in tracked source or docs — CONTRIBUTING.md: 'No emoji in source or user-facing text':"
            echo "$EMOJI_HITS"
            exit 1
          fi
          echo "OK: no emoji in tracked source or docs."
