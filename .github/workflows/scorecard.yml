# OpenSSF Scorecard: independent third-party security score (0-10) from
# observable repo state — branch protection, pinned deps, token permissions,
# SAST, disclosure process. Published, not self-reported.
# Runs weekly plus on main-branch pushes; results upload as SARIF code scanning.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main, dev]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
