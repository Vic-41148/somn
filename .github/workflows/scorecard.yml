# OpenSSF Scorecard: independent third-party security score (0-10) from
# observable repo state — branch protection, pinned deps, token permissions,
# SAST, disclosure process. Published, not self-reported.
# Runs weekly plus on main-branch pushes; results upload as SARIF code scanning.
name: Scorecard

# Scorecard only supports the default branch: pushes anywhere else fail with
# "Only the default branch is supported", so this deliberately runs on main
# (reached via release merges) plus the weekly schedule — never on dev.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
