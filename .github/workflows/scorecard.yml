# OpenSSF Scorecard: independent third-party security score (0-10) from
# observable repo state — branch protection, pinned deps, token permissions,
# SAST, disclosure process. Published, not self-reported.
# Runs weekly plus on main-branch pushes; results upload as SARIF code scanning.
name: Scorecard

# Scorecard only supports the default branch: pushes anywhere else fail with
# "Only the default branch is supported", so this deliberately runs on main
# (reached via release merges) plus the weekly schedule — never on dev.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
