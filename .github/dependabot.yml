version: 2
updates:
  # Gradle covers all version-catalog dependencies (AGP, Room, SQLCipher, LiteRT, …).
  # Alerts open automatically on vulnerable versions; triage them, don't ignore them.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
