version: 2
updates:
  # Gradle covers all version-catalog dependencies (AGP, Room, SQLCipher, LiteRT, …).
  # Alerts open automatically on vulnerable versions; triage them, don't ignore them.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # These majors need compileSdk 37 (project is on 36): offered PRs fail AAR
    # metadata checks by design until the SDK bump. Revisit, don't delete.
    ignore:
      - dependency-name: "agp"
        versions: [">= 9.4.0"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">= 2.4.0"]
      - dependency-name: "androidx.hilt:hilt-navigation-compose"
        versions: [">= 1.4.0"]
      - dependency-name: "androidx.hilt:hilt-work"
        versions: [">= 1.4.0"]
      - dependency-name: "androidx.hilt:hilt-compiler"
        versions: [">= 1.4.0"]
      - dependency-name: "androidx.health.connect:connect-client"
        versions: [">= 1.2.0-alpha06"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19.0"]
      # 2.1.5 pin is load-bearing (2.1.6+ splits litert-api namespace, AGP merger
      # rejects the duplicate). See the tensorflow-lite comment in libs.versions.toml.
      - dependency-name: "com.google.ai.edge.litert:litert"
        versions: ["> 2.1.5"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
