# Single source of truth for the app version.
#
# Bump versionName here before tagging a release. versionCode is derived from it
# (0.2.0 -> 2000) so the two cannot drift. The Release workflow refuses to publish
# when the pushed tag and this file disagree.
#
# Deliberately not `git describe`: F-Droid and its reproducible-build pipeline
# build from a source tarball with no .git, where a git-derived version silently
# falls back to a stale value.
versionName=0.2.0
