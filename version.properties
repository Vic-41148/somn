# Single source of truth for the app version.
#
# Bump versionName and versionCode together before tagging a release. versionCode
# must equal the value derived from versionName (0.2.0 -> 2000); the Gradle build
# fails if they disagree, so the two cannot drift. The Release workflow refuses to
# publish when the pushed tag and this file disagree.
#
# versionCode is declared explicitly because F-Droid's UpdateCheckData regex reads
# it from this file at the release tag.
#
# Deliberately not `git describe`: F-Droid and its reproducible-build pipeline
# build from a source tarball with no .git, where a git-derived version silently
# falls back to a stale value.
versionName=0.2.1
versionCode=2001
