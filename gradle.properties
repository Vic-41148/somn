org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Load-bearing on machines whose default java is not 17: AGP/Gradle here need JDK 17.
# This Arch path (/usr/lib/jvm/java-17-openjdk, no arch suffix) does NOT exist on Debian,
# so F-Droid's buildserver must override it in the recipe, exactly like CI already does:
#   gradle:
#     - -Dorg.gradle.java.home=$JAVA_HOME
# Do not "fix" this by deleting the line without setting JAVA_HOME locally first.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

