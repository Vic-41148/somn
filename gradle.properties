org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Load-bearing on machines whose default java is not 17: AGP/Gradle here need JDK 17.
# Do NOT hardcode org.gradle.java.home in this repo file: GitHub-managed workflows
# (Automatic Dependency Submission) and F-Droid's buildserver don't pass -D overrides
# and die on a path that only exists on one machine. Set it per-machine instead:
#   echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk' >> ~/.gradle/gradle.properties
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

